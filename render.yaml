services:
  - type: web
    name: api-vacinacao-alagoas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/seed.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
